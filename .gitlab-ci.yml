default:
  image: node:16.16.0

deploy_preview:
  stage: deploy
  except:
    - dev
  script:
    - npm install --global vercel
    - vercel pull --yes --environment=preview --token=ZG1U9l1Ea7ns6Y6XMRIQ3KBS
    - vercel build --token=ZG1U9l1Ea7ns6Y6XMRIQ3KBS
    - vercel deploy --prebuilt  --token=ZG1U9l1Ea7ns6Y6XMRIQ3KBS

deploy_production:
  stage: deploy
  only:
    - dev
  script:
    - npm install --global vercel
    - vercel pull --yes --environment=production --token=ZG1U9l1Ea7ns6Y6XMRIQ3KBS
    - vercel build --prod --token=ZG1U9l1Ea7ns6Y6XMRIQ3KBS
    - vercel deploy --prebuilt --prod --token=ZG1U9l1Ea7ns6Y6XMRIQ3KBS